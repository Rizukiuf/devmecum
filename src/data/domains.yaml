# Delapan belas domain Devmecum (rancangan §5.2).
# description: satu kalimat tentang cakupan domain, ditampilkan di halaman domain.
# freshnessMonths: batas kedaluwarsa verifikasi halaman. 3 bulan untuk bidang
# yang bergerak cepat, 6 bulan untuk lainnya (rancangan §9).
- id: fondasi
  name: Fondasi
  description: "Konsep dasar yang dipakai di semua bidang: cara kerja komputer, algoritma, struktur data, jaringan, dan terminal."
  order: 1
  freshnessMonths: 6
- id: bahasa
  name: Bahasa pemrograman
  description: "Bahasa untuk menulis program, dari Python, JavaScript, dan Java sampai Rust, Go, dan SQL."
  order: 2
  freshnessMonths: 6
- id: web-frontend
  name: Web frontend
  description: "Membangun tampilan di browser: HTML, CSS, framework seperti React dan Vue, serta alat build dan performa web."
  order: 3
  freshnessMonths: 3
- id: web-backend
  name: Web backend dan API
  description: "Sisi server aplikasi web: runtime, framework backend, desain API, autentikasi, caching, dan antrean pesan."
  order: 4
  freshnessMonths: 6
- id: mobile
  name: Mobile
  description: "Membuat aplikasi Android dan iOS, baik native maupun lintas platform, sampai terbit di toko aplikasi."
  order: 5
  freshnessMonths: 6
- id: desktop
  name: Desktop
  description: "Membuat aplikasi desktop untuk Windows, macOS, dan Linux dengan Electron, Tauri, Qt, .NET, dan sejenisnya."
  order: 6
  freshnessMonths: 6
- id: database
  name: Database
  description: "Dasar basis data, database relasional dan NoSQL, ORM, serta database vektor untuk pencarian dan AI."
  order: 7
  freshnessMonths: 6
- id: data
  name: Data dan analitik
  description: "Mengolah dan menganalisis data: pustaka Python untuk data, visualisasi, pipeline data, data warehouse, dan BI."
  order: 8
  freshnessMonths: 6
- id: ai-ml
  name: AI dan machine learning
  description: "Machine learning klasik sampai deep learning, computer vision, NLP, dan cara melatih serta menjalankan model."
  order: 9
  freshnessMonths: 6
- id: genai
  name: Generative AI dan LLM
  description: "Cara kerja LLM dan membangun aplikasi di atasnya: prompt, RAG, agen AI, fine-tuning, dan evaluasi."
  order: 10
  freshnessMonths: 3
- id: cloud
  name: Cloud
  description: "Konsep cloud dan platform utamanya, seperti AWS, Google Cloud, Azure, dan Cloudflare, plus serverless dan biayanya."
  order: 11
  freshnessMonths: 3
- id: devops
  name: DevOps dan infrastruktur
  description: "Mengirim dan menjalankan perangkat lunak: Git, Linux, container, Kubernetes, CI/CD, infrastructure as code, dan monitoring."
  order: 12
  freshnessMonths: 6
- id: keamanan
  name: Keamanan
  description: "Melindungi aplikasi dan sistem secara defensif: OWASP Top 10, kriptografi, identitas dan akses, serta keamanan cloud."
  order: 13
  freshnessMonths: 6
- id: arsitektur
  name: Arsitektur dan rekayasa perangkat lunak
  description: "Merancang dan mengelola perangkat lunak: siklus pengembangan, design patterns, microservices, system design, dan code review."
  order: 14
  freshnessMonths: 6
- id: testing
  name: Testing dan kualitas
  description: "Memastikan perangkat lunak berjalan benar lewat unit test, end-to-end test, load testing, dan analisis statis."
  order: 15
  freshnessMonths: 6
- id: tools
  name: Tools dan produktivitas
  description: "Alat kerja sehari-hari developer: editor dan IDE, terminal modern, package manager, serta asisten AI untuk coding."
  order: 16
  freshnessMonths: 6
- id: game
  name: Game
  description: "Dasar membuat game: matematika dan fisika game, serta engine seperti Unity, Unreal Engine, dan Godot."
  order: 17
  freshnessMonths: 6
- id: embedded
  name: "Embedded, IoT, dan bidang khusus"
  description: "Pemrograman perangkat keras dan bidang khusus: Arduino, ESP32, Raspberry Pi, IoT, smart contract, dan komputasi kuantum."
  order: 18
  freshnessMonths: 6
