name: Mojo
slug: mojo
type: language
domain: bahasa
template: A
license: Apache-2.0 WITH LLVM-exception # sumber: https://raw.githubusercontent.com/modular/modular/main/LICENSE ("Mojo and its contributions are licensed under the Apache License v2.0 with LLVM Exceptions"; bagian MAX berlisensi terpisah)
website: https://mojolang.org/
docs: https://mojolang.org/docs/
latestVersion: "1.2.0" # dari GitHub modular/modular (tag) per 17 November 2026
versionSource: { kind: github, repo: modular/modular, tagPattern: '^mojo/v(\d)\.(\d+)\.(\d+)$' } # repo modular/modular berisi Mojo dan MAX; hanya tag mojo/v1.x.y dst. (satu digit mayor) yang dipakai: tag beta (mojo/v1.0.0b1) dan tag lama bergaya kalender (mojo/v24.5.0) tidak cocok
requires: []
alternatives: [python, rust, zig]
tags: [ai, gpu, sistem, python-interop]
adoption: khusus # SO Survey 2026: 0,6% responden (82 dari 14.099), peringkat 49, di bawah 5%; ceruk komputasi AI dan GPU ("The systems language for the AI era", https://www.mojolang.org); bukan berkembang karena tren tidak naik >= 2 poin; status "pilihan utama" di ceruk itu tidak dibuktikan halaman resmi; https://survey.stackoverflow.co/2026/technology/data/languages
trend: stabil # SO 0,4% (2025; https://survey.stackoverflow.co/2025/technology) ke 0,6% (2026; https://survey.stackoverflow.co/2026/technology/data/languages), naik 0,2 poin (< 2); sampel kecil (82 responden)
metrics:
  github: { repo: modular/modular }
useCases:
  - kernel GPU dan komputasi berkinerja tinggi
  - beban kerja AI dan machine learning
  - migrasi bertahap dari prototipe Python ke produksi
