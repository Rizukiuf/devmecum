name: Deploy

on:
  push:
    branches: [main]
  # Build ulang mingguan supaya lencana "perlu ditinjau" tetap sesuai tanggal.
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ASTRO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Pasang dependensi
        run: pnpm install --frozen-lockfile

      - name: Pasang Chromium (untuk merender diagram)
        run: pnpm exec playwright install --with-deps chromium

      - name: Pemeriksaan tipe
        run: pnpm check

      - name: Tes unit
        run: pnpm test

      - name: Validasi konten
        run: pnpm validate

      # Angka popularitas berubah tiap minggu, jadi diambil saat deploy (tidak masuk Git).
      # Kegagalan registri tidak menggagalkan langkah ini (skrip keluar 0); angka yang gagal
      # diambil tidak tampil pada deploy ini. Berkas yang tidak bisa ditulis atau galat tak
      # terduga tetap menggagalkan langkah.
      # Langkah ini membuat sekitar satu permintaan API GitHub per teknologi yang punya entri
      # `metrics.github` (sekitar 400 pada ukuran penuh), sedangkan batas GITHUB_TOKEN adalah
      # 1.000 permintaan per jam dan setiap push ke main men-deploy. Deploy beruntun bisa
      # kehilangan angka bintang pada deploy itu (degradasi bertahap, memang disengaja).
      - name: Ambil metrik
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm metrics

      - name: Build produksi
        run: pnpm build

      - name: Pastikan tanpa konten uji
        run: node scripts/assert-no-fixtures.mjs

      - name: Anggaran file
        run: pnpm budget

      - name: Deploy ke Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
