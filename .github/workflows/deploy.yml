name: Deploy

on:
  push:
    branches: [main]
  # Build ulang mingguan supaya lencana "perlu ditinjau" tetap sesuai tanggal.
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ASTRO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Pasang dependensi
        run: pnpm install --frozen-lockfile

      - name: Pemeriksaan tipe
        run: pnpm check

      - name: Tes unit
        run: pnpm test

      - name: Build produksi
        run: pnpm build

      - name: Pastikan tanpa konten uji
        run: node scripts/assert-no-fixtures.mjs

      - name: Anggaran file
        run: pnpm budget

      - name: Deploy ke Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
