name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    env:
      ASTRO_TELEMETRY_DISABLED: 1
      # PR dari fork tidak menerima secret; langkah pratinjau dilewati di sana.
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Pasang dependensi
        run: pnpm install --frozen-lockfile

      - name: Pasang Chromium untuk Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Pemeriksaan tipe
        run: pnpm check

      - name: Tes unit
        run: pnpm test

      - name: Validasi konten
        run: pnpm validate

      - name: Build dengan konten uji dan tes e2e
        run: pnpm test:e2e

      - name: Anggaran file
        run: pnpm budget

      - name: Anggaran Lighthouse
        run: pnpm lhci

      - name: Unggah pratinjau
        id: preview
        if: env.HAS_CLOUDFLARE == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -o pipefail
          output="$(pnpm exec wrangler preview --name "pr-${PR_NUMBER}" --json)"
          printf '%s\n' "$output"
          url="$(printf '%s' "$output" | jq -er '.preview.urls[0]')"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Tulis URL pratinjau di PR
        if: steps.preview.outputs.url != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none \
            --body "Pratinjau (memuat konten uji): $PREVIEW_URL"
