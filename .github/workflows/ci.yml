name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    env:
      ASTRO_TELEMETRY_DISABLED: 1
      # PR dari fork tidak menerima secret; langkah pratinjau dilewati di sana.
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Pasang dependensi
        run: pnpm install --frozen-lockfile

      - name: Pasang Chromium untuk Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Pemeriksaan tipe
        run: pnpm check

      - name: Tes unit
        run: pnpm test

      - name: Validasi konten
        run: pnpm validate

      # Jalur yang sama dengan deploy.yml, supaya kegagalan deploy (draf bocor,
      # tautan mati di set halaman asli, anggaran file, render diagram) terlihat
      # di PR dan bukan sesudah merge.
      - name: Build produksi
        run: pnpm build

      - name: Pastikan tanpa konten uji
        run: node scripts/assert-no-fixtures.mjs

      - name: Anggaran file (build produksi)
        run: pnpm budget

      - name: Build dengan konten uji dan tes e2e
        run: pnpm test:e2e

      - name: Anggaran Lighthouse
        run: pnpm lhci

      - name: Unggah pratinjau
        id: preview
        if: env.HAS_CLOUDFLARE == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Situs ini hanya aset statis tanpa skrip Worker, sedangkan
          # `wrangler preview` butuh skrip. Jadi pratinjau dibuat sebagai versi
          # baru ber-alias. dist/ masih berisi build uji dari langkah e2e.
          pnpm exec wrangler versions upload --preview-alias "pr-${PR_NUMBER}" \
            --message "PR ${PR_NUMBER}" 2>&1 | tee wrangler-preview.log
          url="$(grep -i 'alias' wrangler-preview.log | grep -oE 'https://[^ ]+' | head -1 || true)"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Tulis URL pratinjau di PR
        if: steps.preview.outputs.url != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none \
            --body "Pratinjau (memuat konten uji): $PREVIEW_URL"
